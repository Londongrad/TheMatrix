services:
  postgres:
    image: postgres:16-alpine
    container_name: matrix-postgres
    ports:
      - "${MATRIX_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - matrix_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: matrix-redis
    ports:
      - "${MATRIX_REDIS_PORT:-6379}:6379"
    volumes:
      - matrix_redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${MATRIX_REDIS_PASSWORD:?MATRIX_REDIS_PASSWORD is required}"
      ]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: matrix-rabbitmq
    ports:
      - "${MATRIX_RABBITMQ_PORT:-5672}:5672"
      - "${MATRIX_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_VHOST: ${MATRIX_RABBITMQ_VHOST:?MATRIX_RABBITMQ_VHOST is required}
      RABBITMQ_DEFAULT_USER: ${MATRIX_RABBITMQ_USERNAME:?MATRIX_RABBITMQ_USERNAME is required}
      RABBITMQ_DEFAULT_PASS: ${MATRIX_RABBITMQ_PASSWORD:?MATRIX_RABBITMQ_PASSWORD is required}
    volumes:
      - matrix_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  matrix_postgres_data:
  matrix_redis_data:
  matrix_rabbitmq_data:
