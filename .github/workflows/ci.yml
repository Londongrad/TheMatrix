name: CI

on:
  push:
    branches:
      - master
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Restore solution
        run: dotnet restore TheMatrix.sln

      - name: Build solution
        run: dotnet build TheMatrix.sln --configuration Release --no-restore -m:1 /nodeReuse:false

      - name: Test solution
        run: dotnet test TheMatrix.sln --configuration Release --no-build

      - name: Scan NuGet packages for known vulnerabilities
        run: dotnet list TheMatrix.sln package --vulnerable --include-transitive

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/matrix-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/matrix-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  advisory-quality:
    name: Advisory Format
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - name: Restore solution
        run: dotnet restore TheMatrix.sln

      - name: Verify dotnet format
        run: dotnet format TheMatrix.sln --verify-no-changes --no-restore
